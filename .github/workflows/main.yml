# ============================================================
# Fast GitHub Actions RDP (Windows 2022 + Tailscale)
# Performance-tuned host + client tips for less lag
# ============================================================
name: win 11 fast

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      # ---------- 1) RDP + PERFORMANCE TUNING (host side) ----------
      - name: Enable RDP + Speed Tweaks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # --- Core RDP enable ---
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Keep NLA off for simple Tailscale login (less auth overhead)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # --- Performance: higher FPS / less artificial delay ---
          # DWM frame interval ~60fps target
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Dwm" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Dwm" -Name "DwmFrameInterval" -Value 15 -Type DWord -Force

          # Remove InteractiveDelay (built-in lag)
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "InteractiveDelay" -Value 0 -Type DWord -Force

          # Prefer higher priority for TermService
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\TermService" -Name "DelayedAutoStart" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue

          # SystemResponsiveness = 0 (don't throttle network for multimedia)
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "SystemResponsiveness" -Value 0 -Type DWord -Force

          # Disable visual bloat for remote sessions
          # Solid wallpaper + no animations = less bandwidth
          reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "" /f | Out-Null
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
          # 2 = Adjust for best performance

          # Disable unnecessary visual effects via UserPreferencesMask-style bulk
          $perf = @(
            @{Path='HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'; Name='TaskbarAnimations'; Value=0},
            @{Path='HKCU:\Control Panel\Desktop\WindowMetrics'; Name='MinAnimate'; Value='0'},
            @{Path='HKCU:\Software\Microsoft\Windows\DWM'; Name='EnableAeroPeek'; Value=0},
            @{Path='HKCU:\Software\Microsoft\Windows\DWM'; Name='AlwaysHibernateThumbnails'; Value=0}
          )
          foreach ($p in $perf) {
            if (-not (Test-Path $p.Path)) { New-Item -Path $p.Path -Force | Out-Null }
            Set-ItemProperty -Path $p.Path -Name $p.Name -Value $p.Value -Force -ErrorAction SilentlyContinue
          }

          # Firewall: allow RDP (clean rule)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Optional: disable Windows Search / Superfetch-like services that steal CPU on runners
          foreach ($svc in @('WSearch','SysMain','DiagTrack','dmwappushservice')) {
            try {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
            } catch {}
          }

          # Restart TermService so settings stick
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Write-Host "RDP + performance tweaks applied."

      # ---------- 2) USER ----------
      - name: Create RDP User
        shell: pwsh
        run: |
          # Must meet Windows complexity (upper + lower + digit + symbol, len >= 8)
          $password = "Ri3z@2026!"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Relax local policy so runner accepts the password reliably
          net accounts /minpwlen:6 2>$null | Out-Null
          $cfg = "$env:TEMP\secpol.cfg"
          $cfg2 = "$env:TEMP\secpol2.cfg"
          secedit /export /cfg $cfg 2>$null | Out-Null
          if (Test-Path $cfg) {
            (Get-Content $cfg) `
              -replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
              -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 6" |
              Set-Content $cfg2
            secedit /configure /db "$env:TEMP\secedit.sdb" /cfg $cfg2 /areas SECURITYPOLICY 2>$null | Out-Null
          }

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -FullName "RDP" -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop
          } else {
            Set-LocalUser -Name "RDP" -Password $securePass
          }
          Set-LocalUser -Name "RDP" -PasswordNeverExpires $true -ErrorAction SilentlyContinue
          Enable-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          Write-Host "User RDP ready. Password: $password"

      # ---------- 3) TAILSCALE (faster install + connect) ----------
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          # Parallel-friendly download
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          # accept-dns=false can reduce DNS lag on some networks

          $tsIP = $null
          for ($i = 0; $i -lt 15; $i++) {
            $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1).Trim()
            if ($tsIP -match '^\d+\.') { break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) { Write-Error "No Tailscale IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

          # Prefer direct path (status check)
          & $ts status
          Write-Host "If status shows 'direct' you get best speed. 'relay' = slower DERP path."

      # ---------- 4) VERIFY ----------
      - name: Verify RDP Port
        shell: pwsh
        run: |
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "User: RDP  Password: Ri3z@2026!"
          $ok = $false
          for ($i = 0; $i -lt 8; $i++) {
            $t = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
            if ($t.TcpTestSucceeded) { $ok = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error "RDP port 3389 not open"; exit 1 }
          Write-Host "RDP TCP OK on $env:TAILSCALE_IP:3389"

      # ---------- 5) STARTUP PAYLOAD + KEEP ALIVE ----------
      - name: Startup Script + Keep Alive
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Ri3z@2026!"
          Write-Host "==================`n"
          Write-Host "CLIENT TIPS FOR SPEED:"
          Write-Host "  1. mstsc → Show Options → Display → Colors = High Color (16-bit)"
          Write-Host "  2. Experience → Choose 'Modem (56 kbps)' or uncheck:"
          Write-Host "     Desktop background, Font smoothing, Desktop composition,"
          Write-Host "     Show window contents while dragging, Menu animations"
          Write-Host "  3. Use Tailscale IP (100.x) not public IP"
          Write-Host "  4. In Tailscale admin, confirm connection is DIRECT not relay`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/TechZoner@001/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          # Wait for profile (first login creates it)
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $rdpProfile) {
              try {
                if (-not (Test-Path $startupPath)) {
                  New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                }
                Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                Write-Host "Downloads.bat placed in Startup"
                cmd /c $downloadPath
                Write-Host "Downloads.bat executed"
                break
              } catch {
                Write-Host "Startup copy error: $($_.Exception.Message)"
                break
              }
            }
            Write-Host "[$(Get-Date -Format HH:mm:ss)] Waiting for RDP profile (log in once via RDP)..."
            Start-Sleep -Seconds 20
          }

          # Keep runner alive
          while ($true) {
            Write-Host "[$(Get-Date -Format HH:mm:ss)] RDP active — cancel workflow to stop"
            Start-Sleep -Seconds 300
          }
'''
